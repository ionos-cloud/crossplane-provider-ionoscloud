name: CI [Weekly]

on:
  schedule:
    # The job will run at 9am UTC
    # every week
    - cron: '0 09 * * WED'
  workflow_dispatch: { }

permissions:
  contents: read
  security-events: write

env:
  DOCKER_BUILDX_VERSION: 'v0.20.1'

jobs:
  trivy:
    runs-on: ubuntu-latest
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: all
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fetch History
        run: git fetch --prune --unshallow
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
      - name: Find the Go Build Cache
        id: go
        run: echo "::set-output name=cache::$(make go.cachedir)"
      - name: Cache the Go Build Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-build-trivy-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-trivy-
      - name: Cache Go Dependencies
        uses: actions/cache@v4
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-
      - name: Vendor Dependencies
        run: make vendor vendor.check
      - name: Build Artifacts
        run: make build
        env:
          BUILD_ARGS: "--load"
      - name: Get Provider Image ID
        run: echo "IMAGE_ID=$(make docker.list | grep "crossplane-provider-ionoscloud" | tr -s ' ' | cut -d' ' -f3)" >> $GITHUB_ENV
      - name: Run Trivy vulnerability scan
        id: trivy-scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_ID }}
          format: 'sarif'
          exit-code: 1
          severity: 'CRITICAL,HIGH'
          output: 'trivy-results.sarif'
      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ failure() && steps.trivy-scan.conclusion == 'failure' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee
        id: govulncheck-scan
        with:
          # go-version-input is left empty to ensure the action uses the Go version from go.mod
          go-version-input: ''
          go-version-file: 'go.mod'
          go-package: './...'
          output-format: 'sarif'
          output-file: 'govulncheck-results.sarif'
      - name: Upload govulncheck scan results to GitHub Security tab
        if: ${{ failure() && steps.govulncheck-scan.conclusion == 'failure' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'govulncheck-results.sarif'

  notification:
    needs: [trivy, govulncheck]
    if: ${{ always() && (needs.trivy.result == 'failure' || needs.govulncheck.result == 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: URL Encode Code Scanning Query
        id: encode-query
        run: |
          base_query="is:open branch:master"
          if [ "${{ needs.trivy.result }}" == "failure" ]; then
            base_query="$base_query tool:trivy"
          fi
          if [ "${{ needs.govulncheck.result }}" == "failure" ]; then
              base_query="$base_query tool:govulncheck"
          fi
          encoded_query=$(echo -n "$base_query" | jq -s -R -r @uri)
          echo "encoded_query=$encoded_query" > $GITHUB_OUTPUT
      - name: Set Notification Details
        run: |
          echo "CI_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          echo "NOTIF_TITLE=Weekly CI Scan Failure" >> $GITHUB_ENV
          echo "NOTIF_LABELS=- security, - weekly-scan" >> $GITHUB_ENV
          echo "CI_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV
          echo "SCAN_RESULTS_URL=${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=${{ steps.encode-query.outputs.encoded_query }}" >> $GITHUB_ENV
      - name: Google Chat Notification
        run: |
          payload=$(jq -n \
            --arg title "$NOTIF_TITLE" \
            --arg subtitle "CI Number: #$CI_NUMBER" \
            --arg repo "${{ github.repository }}" \
            --arg labels "$NOTIF_LABELS" \
            --arg ciurl "$CI_URL" \
            --arg resultsurl "$SCAN_RESULTS_URL" \
            '{
              "cards": [
                {
                  "header": { "title": "Crossplane Weekly CI Failed", "subtitle": $subtitle },
                  "sections": [
                    {
                      "widgets": [
                        { "keyValue": { "topLabel": "Repository", "content": $repo } },
                        { "keyValue": { "topLabel": "Title", "content": $title } },
                        { "keyValue": { "topLabel": "Assigned Labels", "content": $labels } },
                        { "buttons": [ { "textButton": { "text": "OPEN RESULTS", "onClick": { "openLink": { "url": $resultsurl } } } } ] }
                      ]
                    }
                  ]
                }
              ]
            }')
          
          curl --location --request POST '${{ secrets.ISSUE_TRACKER_WEBHOOK }}' \
          --header 'Content-Type: application/json' \
          --data-raw "$payload"
