apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: debug-config
spec:
  deploymentTemplate:
    spec:
      selector: {}
      strategy: {}
      template:
        spec:
          containers:
          - args:
            - --debug
            # In order to enable name uniqueness support for IONOS CLOUD Resources, uncomment the next line:
            # - --unique-names
            name: package-runtime
            resources: {}
          # In order to use the server set and the stateful server set features, uncomment the next line:
          #serviceAccountName: crossplane
